<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hynoe YouTube Organizer</title><link rel="stylesheet" href="./styles.css"></head><body><main><section class="card"><div class="brand">H Y N O E</div><h1>YouTube Organizer</h1><p>Organize the full @Hynoe catalog without sacrificing monetization value. Public long-form is protected by default; outdated videos are archive-labeled instead of blindly unlisted.</p><p id="state" class="status">Checking your creator session…</p><button id="organize" type="button" disabled>Organize Channel — Watch-Hour Safe</button><button id="dl2" class="secondary" type="button" disabled style="margin-top:12px">Prepare Dying Light 2 Archive Only</button><button id="revive" class="secondary" type="button" disabled style="margin-top:12px">Verify Minecraft Short Revival</button><button id="apply" class="secondary" type="button" disabled style="margin-top:12px">Re-run Metadata Audit (Titles/Descriptions Only)</button><p style="margin-top:14px"><a href="./" style="color:#d8a942;font-weight:800">Back to YouTube Agent</a></p></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.58.0';const s=createClient('https://bgtxfzvzksgvradodafo.supabase.co','sb_publishable__rZ-ByelsWiRwQPTOEST4w_4u7TyFNe',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const state=document.getElementById('state'),organize=document.getElementById('organize'),btn=document.getElementById('apply'),revive=document.getElementById('revive'),dl2=document.getElementById('dl2');const set=(m,t='')=>{state.textContent=m;state.className='status '+t};async function channel(){const{data,error}=await s.rpc('ensure_hynoe_channel');if(error)throw error;const id=data?.[0]?.channel_id;if(!id)throw new Error('Hynoe channel unavailable');return id}async function functionError(error){try{const r=error?.context;if(r?.clone){const body=await r.clone().json();if(body?.error)return body.error}}catch{}return error?.message||'Request failed'}function formatOrganization(data){const audited=Number(data?.audit_scope_videos||0),unlisted=Number(data?.unlisted||0),already=Number(data?.already_unlisted||0),protectedCount=Number(data?.protected_outdated_public||0),labeled=Number(data?.archive_labeled||0),removed=Number(data?.removed_from_main_smp||0),created=Number(data?.playlists_created||0),updated=Number(data?.playlists_updated||0),added=Number(data?.playlist_items_added||0),deferred=Number(data?.playlist_items_deferred||0),failed=Array.isArray(data?.failures)?data.failures.length:0;const monetization=data?.monetization_lock?'Watch-hour protection ON. ':'';const base=`${monetization}${audited||'Full'} videos audited; ${unlisted} safe junk/empty videos unlisted${already?` (${already} were already unlisted)`:''}; ${protectedCount} outdated public videos protected from unlisting; ${labeled} newly archive-labeled; ${removed} removed from the current SMP playlist; ${created} playlists created; ${updated} playlists updated; ${added} playlist placements added${deferred?`; ${deferred} lower-priority placements deferred by YouTube quota safety`:''}.`;if(!failed)return{retry:deferred>0,message:`Channel organization complete: ${base}${deferred?' Run this organizer again later to continue the remaining archive placements without risking quota exhaustion.':''}`};const details=data.failures.slice(0,5).map(f=>[f.stage,f.video_id||f.playlist,f.error].filter(Boolean).join(' — ')).join(' | ');return{retry:true,message:`Channel organization partially complete: ${base} ${failed} failures. ${details}`}}function formatCatalog(data){const total=Number(data?.total||61),updated=Number(data?.updated||0),unchanged=Number(data?.unchanged||0),failed=Number(data?.failed||0);if(data?.partial||failed>0){const details=(data?.failures||[]).map(f=>`${f.video_id}: ${f.error}`).join(' | ');return{retry:true,message:`Metadata audit: ${updated} updated, ${unchanged} already current, ${failed} failed out of ${total}.${details?` ${details}`:''}`}}return{retry:false,message:`Metadata audit complete: ${updated} updated; ${unchanged} already current. This did not change video privacy.`}}async function runOrganize(){organize.disabled=true;organize.textContent='Organizing 882-video catalog…';try{const id=await channel();set('Applying watch-hour safeguards, archive labels and playlist organization across the audited catalog…');const{data,error}=await s.functions.invoke('youtube-channel-organize',{body:{channel_id:id}});if(error)throw new Error(await functionError(error));if(data?.error)throw new Error(data.error);const result=formatOrganization(data);set(result.message,result.retry?'error':'ok');if(result.retry){organize.disabled=false;organize.textContent='Continue Channel Organization'}else organize.textContent='Channel Organized — Watch Hours Protected'}catch(e){set(String(e).replace(/^Error:\s*/,''),'error');organize.disabled=false;organize.textContent='Retry Channel Organization'}}async function runRevive(){revive.disabled=true;revive.textContent='Checking Minecraft Short…';try{const id=await channel();const{data,error}=await s.functions.invoke('youtube-short-revive',{body:{channel_id:id}});if(error)throw new Error(await functionError(error));if(data?.error)throw new Error(data.error);if(!data?.ok)throw new Error('YouTube did not verify the Short yet. Retry in a moment.');set('Minecraft Short is public with the approved archive metadata.','ok');revive.textContent='Minecraft Short Verified'}catch(e){set(String(e).replace(/^Error:\s*/,''),'error');revive.disabled=false;revive.textContent='Retry Minecraft Short Check'}}async function runDl2(){dl2.disabled=true;dl2.textContent='Preparing Dying Light 2 archive…';try{const id=await channel();const{data,error}=await s.functions.invoke('youtube-dl2-archive-prepare',{body:{channel_id:id}});if(error)throw new Error(await functionError(error));if(data?.error)throw new Error(data.error);const failed=Number(data?.failed||0);set(`Dying Light 2 archive: ${Number(data?.updated||0)} updated, ${Number(data?.unchanged||0)} already current, ${failed} failed, ${Number(data?.playlist_added||0)} playlist additions.`,failed?'error':'ok');dl2.textContent=failed?'Retry Dying Light 2 Archive':'Dying Light 2 Archive Prepared';if(failed)dl2.disabled=false}catch(e){set(String(e).replace(/^Error:\s*/,''),'error');dl2.disabled=false;dl2.textContent='Retry Dying Light 2 Archive'}}async function init(){const{data:{session}}=await s.auth.getSession();if(!session){set('Sign in on the main Hynoe YouTube Agent first, then return here.','error');return}await channel();set('Ready. Monetization lock is ON: public long-form stays public by default, while stale/outdated material is separated into archive playlists.','ok');organize.disabled=false;btn.disabled=false;revive.disabled=false;dl2.disabled=false;const q=new URLSearchParams(location.search);if(q.get('organize')==='1')await runOrganize();else if(q.get('dl2')==='1')await runDl2();else if(q.get('revive')==='1')await runRevive()}organize.addEventListener('click',runOrganize);btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Running metadata audit…';try{const id=await channel();const{data,error}=await s.functions.invoke('youtube-catalog-optimize',{body:{channel_id:id,preset:'catalog_optimization'}});if(error)throw new Error(await functionError(error));if(data?.error)throw new Error(data.error);const result=formatCatalog(data);set(result.message,result.retry?'error':'ok');if(result.retry){btn.disabled=false;btn.textContent='Retry Metadata Audit'}else btn.textContent='Metadata Audit Complete'}catch(e){set(String(e).replace(/^Error:\s*/,''),'error');btn.disabled=false;btn.textContent='Retry Metadata Audit'}});revive.addEventListener('click',runRevive);dl2.addEventListener('click',runDl2);init().catch(e=>set(e.message,'error'));</script></body></html>
