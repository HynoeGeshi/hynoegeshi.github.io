<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hynoe YouTube Optimizer</title><link rel="stylesheet" href="./styles.css"></head><body><main><section class="card"><div class="brand">H Y N O E</div><h1>YouTube Optimizer</h1><p>Applies the approved first metadata optimization batch to @Hynoe through the existing authenticated YouTube connection.</p><p id="state" class="status">Checking your creator session…</p><button id="apply" type="button" disabled>Apply 8 optimizations</button><p><a href="./" style="color:#d8a942;font-weight:800">Back to YouTube Agent</a></p></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.58.0';const s=createClient('https://bgtxfzvzksgvradodafo.supabase.co','sb_publishable__rZ-ByelsWiRwQPTOEST4w_4u7TyFNe',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const state=document.getElementById('state'),btn=document.getElementById('apply');const set=(m,t='')=>{state.textContent=m;state.className='status '+t};async function channel(){const{data,error}=await s.rpc('ensure_hynoe_channel');if(error)throw error;const id=data?.[0]?.channel_id;if(!id)throw new Error('Hynoe channel unavailable');return id}function formatResult(data){const updated=Number(data?.updated||0),unchanged=Number(data?.unchanged||0),failed=Number(data?.failed||0);if(data?.partial||failed>0){const details=(data?.failures||[]).map(f=>`${f.video_id}: ${f.error}`).join(' | ');return{retry:true,message:`Completed batch: ${updated} updated, ${unchanged} already current, ${failed} failed.${details?` ${details}`:''}`}}return{retry:false,message:`Applied ${updated} updates; ${unchanged} were already current. Every item was re-read from YouTube for verification.`}}async function functionError(error){try{const r=error?.context;if(r?.clone){const body=await r.clone().json();if(body?.error)return body.error}}catch{}return error?.message||'Optimization failed'}async function init(){const{data:{session}}=await s.auth.getSession();if(!session){set('Sign in on the main Hynoe YouTube Agent first, then return here.','error');return}await channel();set('Ready. This will update the approved 8-video batch and verify each change on YouTube before continuing.','ok');btn.disabled=false}btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Applying…';try{const id=await channel();set('Applying and verifying YouTube metadata…');const{data,error}=await s.functions.invoke('youtube-metadata-update',{body:{channel_id:id,preset:'initial_optimization'}});if(error)throw new Error(await functionError(error));if(data?.error)throw new Error(data.error);const result=formatResult(data);set(result.message,result.retry?'error':'ok');if(result.retry){btn.disabled=false;btn.textContent='Retry failed optimizations'}else{btn.textContent='Optimization applied'}}catch(e){set(String(e).replace(/^Error:\s*/,''),'error');btn.disabled=false;btn.textContent='Retry optimization'}});init().catch(e=>set(e.message,'error'));</script></body></html>
