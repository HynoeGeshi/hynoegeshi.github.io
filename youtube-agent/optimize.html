.retry){btn.disabled=false;btn.textContent='Retry catalog optimization'}else{btn.textContent='Catalog optimization applied'}}catch(e){set(String(e).replace(/^Error:\s*/,''),'error');btn.disabled=false;btn.textContent='Retry catalog optimization'}});revive.addEventListener('click',runRevive);init().catch(e=>set(e.message,'error'));</script></body></html>
