name: Optimize Hynoe Flicks Images

on:
  push:
    branches:
      - 'overhaul/**'
    paths:
      - 'scripts/optimize_portfolio.py'
      - 'assets/img/p*.jpg'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate responsive portfolio derivatives
        run: python scripts/optimize_portfolio.py --report
      - name: Verify derivative budgets
        run: python scripts/optimize_portfolio.py --check
      - name: Commit generated derivatives
        run: |
          git config user.name "Hynoe Flicks Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/portfolio
          if git diff --cached --quiet; then
            echo "No derivative changes"
          else
            git commit -m "perf: generated image derivatives"
            git push
          fi
